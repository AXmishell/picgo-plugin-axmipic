name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 解析版本号（去掉 v 前缀）
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 运行测试
        run: npm test

      - name: 同步 package.json 版本到 tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: 生成插件文件夹压缩包（.zip）
        env:
          PKG: picgo-plugin-axmipic-${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "build/${PKG}"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const pkg = require("./package.json");
            const dest = path.join("build", process.env.PKG);
            const files = ["package.json", ...(pkg.files || [])];
            for (const f of files) {
              fs.cpSync(f, path.join(dest, f), { recursive: true });
            }
          '
          (cd build && zip -qr "../${PKG}.zip" "${PKG}")

      - name: 生成校验文件（SHA256）
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          sha256sum "picgo-plugin-axmipic-${version}.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "picgo-plugin-axmipic-${version}.zip" \
            "SHA256SUMS"
